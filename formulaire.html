<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Formulaire Inscription</title>
<style>
  body{font-family:Arial,sans-serif;background:#f3f3f3;margin:0;padding:15px}
  .feuille{max-width:800px;margin:auto;background:#fff;padding:0;border:1px solid #000}
  .top{display:flex;justify-content:space-between;padding:20px;border-bottom:3px solid #000}
  .logo h2{margin:0;font-size:19px}
  .logo p{margin:4px 0 0;font-size:11px}
  .photo{width:130px;height:155px;border:2px dashed #000;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#f9f9f9;text-align:center}
  .photo b{font-size:11px}
  .photo span{font-size:9px;color:#666}
  .corps{padding:20px}
  label{font-size:10px;font-weight:bold;display:block;margin-top:15px}
  input,select{width:100%;padding:10px;border:1.5px solid #000;margin-top:5px;box-sizing:border-box}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:15px}
  .btns{display:flex;gap:10px;padding:15px;background:#eee}
  .btns button{flex:1;padding:12px;font-weight:bold;border:none;cursor:pointer}
  .print{background:#fff;border:1.5px solid #000}
  .pdf{background:#000;color:#fff}
  @media print{.btns{display:none} body{background:#fff;padding:0} .feuille{border:none}}
</style>
</head>
<body>
<div class="feuille" id="aImprimer">
  <div class="top">
    <div class="logo">
      <h2>GS NOUVELLE VISION / CHEZ L'ESTHÉTICIENNE</h2>
      <p>FICHE D'INSCRIPTION OFFICIELLE 2025-2026</p>
      <p>Cocody Riviera - 01 70 46 44 71</p>
    </div>
    <div class="photo">
      <div style="font-size:30px">📷</div>
      <b>COLLER PHOTO ICI</b>
      <span>Photo 4x4<br>Ne pas agrafer<br>Colle uniquement</span>
    </div>
  </div>
  <div class="corps">
    <div class="row">
      <div><label>NOM</label><input></div>
      <div><label>PRENOMS</label><input></div>
    </div>
    <div class="row">
      <div><label>DATE DE NAISSANCE</label><input type="date"></div>
      <div><label>CONTACT WHATSAPP</label><input></div>
    </div>
    <label>SERVICE / CLASSE</label>
    <select><option>Massage Relaxant 20.000 FCFA</option><option>Massage Tonique 25.000 FCFA</option><option>Inscription Scolaire</option></select>
    <label>DOMICILE</label><input>
    <label>REMARQUES</label><input>
    <div style="margin-top:30px;display:flex;justify-content:space-between">
      <div style="text-align:center"><div style="width:200px;height:70px;border:1px solid #999"></div><label>Signature demandeur</label></div>
      <div style="text-align:center"><div style="width:200px;height:70px;border:1px solid #999"></div><label>Direction</label></div>
    </div>
  </div>
  <div class="btns">
    <button class="print" onclick="window.print()">🖨️ IMPRIMER</button>
    <button class="pdf" onclick="toPDF()">📄 PDF</button>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script>
function toPDF(){html2pdf().set({margin:0,filename:'Fiche-avec-Photo.pdf',html2canvas:{scale:2},jsPDF:{format:'a4'}}).from(document.getElementById('aImprimer')).save()}
</script>
</body>
</html>
